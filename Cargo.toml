[workspace]
members = [
  "memedit",
  "tasks",
  "windows"
]

[workspace.dependencies]
once_cell = "1.19.0"
parking_lot = "0.12.1"
serde = { version = "1.0.197", features = ["derive"] }

[workspace.dependencies.windows]
version = "0.62.0"
features = ["Win32_UI_Input_XboxController"]

[package]
name = "practice-tool-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
crossbeam-channel = "0.5.12"
imgui = { version = "0.12", features = ["tables-api"] }
once_cell.workspace = true
parking_lot.workspace = true
semver = "1"
serde.workspace = true
serde_path_to_error = "0.1"
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
ureq = { version = "2", features = ["json"] }
windows.workspace = true

[features]
profiling = ["windows/Win32_System_Performance", "windows/Win32_System_Threading"]

[dev-dependencies]
glow = "0.12.0"
imgui-glow-renderer = "0.12.0"
imgui-sdl2-support = "0.12.0"
sdl2 = { version = "0.34.5" }
tempfile = "3.10.1"
